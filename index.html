<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Single | Écouter Maintenant</title>
     
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>  
<body class="bg-dark text-light">

    <header class="py-4 position-absolute w-100 z-3">
        <div class="container text-center">
            <h2 class="text-uppercase tracking-wide fw-bold fs-4 m-0">JOSEF</h2>
        </div>
    </header>

    <section class="hero-section d-flex align-items-center justify-content-center vh-100 position-relative overflow-hidden">
        
        <div class="hero-bg position-absolute w-100 h-100 "></div>
        
        <div class="container text-center position-relative z-2">
            <div class="fade-in-up">
                <span class="badge bg-danger mb-3 px-3 py-2 text-uppercase letter-spacing">Nouveau Single</span>
                
                <h1 class="display-1 fw-extrabold text-uppercase mb-3 glow-text">All on black</h1>
                <p class="lead mb-5 fw-light">Disponible sur toutes les plateformes de streaming.</p>
                
                <div id="countdown" class="d-flex justify-content-center gap-4 mb-5 text-center">
                    </div>

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                    <a href="https://open.spotify.com/search/himra"  target="_blank" class="btn btn-spotify btn-lg rounded-pill px-5 py-3 fw-bold animate-pulse">
                        <i class="bi bi-spotify me-2"></i> Écouter sur Spotify
                    </a>
                    <a href="https://youtu.be/XfCqObC_yU4?si=J3_jJWh9cWeiJ257" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light btn-lg rounded-pill px-5 py-3 fw-bold hover-scale">
                    <i class="bi bi-youtube text-danger me-2"></i> Voir le Clip
                    </a>
                </div>
            </div>
        </div>
        
        <div class="scroll-indicator position-absolute bottom-0 start-50 translate-middle-x mb-4 bounce">
            <i class="bi bi-chevron-down fs-2 text-white-50"></i>
        </div>
    </section>

    <section class="py-5 bg-black">
        <div class="container text-center py-5">
            <div class="col-lg-8 mx-auto scroll-reveal">
                <h2 class="fw-bold mb-4">Un avant-goût du morceau</h2>
                <!-- <p class="text-secondary mb-4">Plongez dans l'univers de Neon Nights avec cet extrait exclusif.</p> -->
                
                <div class="audio-player bg-dark border border-secondary rounded-pill p-3 d-flex align-items-center justify-content-between shadow-lg">
                    <button class="btn btn-light rounded-circle play-btn">
                        <i class="bi bi-play-fill fs-4"></i>
                    </button>
                    <div class="progress flex-grow-1 mx-3" style="height: 8px;">
                        <div class="progress-bar bg-danger" role="progressbar" style="width: 30%;"></div>
                    </div>
                    <span class="text-secondary small">0:30 / 3:45</span>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-4 bg-dark text-center border-top border-secondary border-opacity-25">
        <div class="container scroll-reveal">
            <div class="d-flex justify-content-center gap-4 mb-3">
                <a href="#" class="text-light fs-4 hover-color"><i class="bi bi-instagram"></i></a>
                <a href="#" class="text-light fs-4 hover-color"><i class="bi bi-tiktok"></i></a>
                <a href="#" class="text-light fs-4 hover-color"><i class="bi bi-twitter-x"></i></a>
            </div>
            <p class="text-secondary small mb-0">&copy; 2026 JOSEF . Tous droits réservés.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
